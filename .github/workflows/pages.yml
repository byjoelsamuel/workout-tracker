name: GitHub Pages redirect

# The app moved to Netlify. GitHub Pages now serves only pages-redirect/: a
# "moved" page that forwards every old address to the same page there, so
# links to byjoelsamuel.github.io/workout-tracker keep working. 404.html is
# the same page, because Pages answers any unknown path with it.
#
# Needs Settings → Pages → Source set to "GitHub Actions".
on:
  push:
    branches: [main]
    paths:
      - "pages-redirect/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: pages-redirect
      - id: deployment
        uses: actions/deploy-pages@v4

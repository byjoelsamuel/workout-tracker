<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <script src="theme-init.js"></script>
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Dashboard — Tsyoku-naru</title>
        <link rel="stylesheet" href="styles.css">
    </head>
    <body>
        <nav class="nav">
            <a href="index.html" class="nav-brand">Tsyoku-naru</a>
            <div class="nav-right">
                <div class="nav-links">
                    <a href="dashboard.html" id="navDashboard">Dashboard</a>
                    <a href="compare.html">Compare</a>
                    <a href="about.html">About</a>
                </div>
                <button id="themeToggle" class="theme-toggle" type="button" aria-label="Toggle dark mode">
                    <svg class="icon icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"></path></svg>
                    <svg class="icon icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79Z"></path></svg>
                </button>
            </div>
        </nav>

        <main class="page">
            <div class="page-header">
                <h1 id="greeting">Your Progress</h1>
                <p class="subhead">Every logged exercise shades its body group a little more orange.</p>
            </div>

            <div class="dashboard-grid">
                <div class="card">
                    <div id="bodyMap" class="body-map-wrap"></div>
                    <ul class="summary-list" id="summaryList"></ul>
                </div>

                <div class="card">
                    <h2>Log an exercise</h2>
                    <form id="logForm" class="form">
                        <label>Body group
                            <select name="bodyGroup" id="groupSelect" required></select>
                        </label>
                        <label>Exercise
                            <input type="text" name="exerciseName" placeholder="e.g. Bench press" required>
                        </label>
                        <p class="form-error" id="logError" hidden></p>
                        <button type="submit" class="button start">Add exercise</button>
                    </form>

                    <h2 class="section-spacer">Recent activity</h2>
                    <ul class="history-list" id="historyList"></ul>
                </div>
            </div>
        </main>

        <script src="app.js"></script>
        <script src="shared/bodyGroups.js"></script>
        <script src="store.js"></script>
        <script src="bodymap.js"></script>
        <script src="dashboard.js"></script>
    </body>
</html>

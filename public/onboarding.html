<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Get Started — Workout Tracker</title>
        <link rel="stylesheet" href="styles.css">
    </head>
    <body>
        <nav class="nav">
            <a href="index.html" class="nav-brand">Workout Tracker</a>
            <div class="nav-links">
                <a href="dashboard.html" id="navDashboard">Dashboard</a>
                <a href="compare.html">Compare</a>
            </div>
        </nav>

        <main class="page">
            <div class="page-header">
                <p class="eyebrow">Step 1</p>
                <h1>Tell us about you</h1>
                <p class="subhead">Name is the only thing we need — the rest just personalizes your tracker.</p>
            </div>

            <div class="card form-card">
                <h2>Create a profile</h2>
                <form id="profileForm" class="form">
                    <label>Name
                        <input type="text" name="name" placeholder="e.g. Joel" required>
                    </label>
                    <label>Bodyweight (kg)
                        <input type="number" name="bodyweight" min="0" step="0.1" placeholder="Optional">
                    </label>
                    <label>Height (cm)
                        <input type="number" name="height" min="0" step="0.1" placeholder="Optional">
                    </label>
                    <label>Age
                        <input type="number" name="age" min="0" step="1" placeholder="Optional">
                    </label>
                    <p class="form-error" id="profileError" hidden></p>
                    <button type="submit" class="button start">Continue</button>
                </form>
            </div>

            <div class="card form-card">
                <h2>Returning?</h2>
                <p class="subhead small">Jump back into an existing profile instead of creating a new one.</p>
                <form id="returningForm" class="form">
                    <label>Profile
                        <select name="userId" id="userSelect">
                            <option value="">Loading…</option>
                        </select>
                    </label>
                    <button type="submit" class="button secondary">Go to dashboard</button>
                </form>
            </div>
        </main>

        <script src="app.js"></script>
        <script src="onboarding.js"></script>
    </body>
</html>

<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <script src="theme-init.js"></script>
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Get Started — Tsyoku-naru</title>
        <link rel="stylesheet" href="styles.css">
    </head>
    <body>
        <nav class="nav">
            <a href="index.html" class="nav-brand">Tsyoku-naru</a>
            <div class="nav-right">
                <div class="nav-links">
                    <a href="dashboard.html" id="navDashboard">Dashboard</a>
                    <a href="compare.html">Compare</a>
                    <a href="about.html">About</a>
                </div>
                <button id="themeToggle" class="theme-toggle" type="button" aria-label="Toggle dark mode">
                    <svg class="icon icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"></path></svg>
                    <svg class="icon icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79Z"></path></svg>
                </button>
            </div>
        </nav>

        <main class="page">
            <div class="page-header">
                <p class="eyebrow">Step 1</p>
                <h1>Tell us about you</h1>
                <p class="subhead">Name is the only thing we need — the rest just personalizes your tracker.</p>
            </div>

            <div class="card form-card">
                <h2>Create a profile</h2>
                <form id="profileForm" class="form">
                    <label>Name
                        <input type="text" name="name" placeholder="e.g. Joel" required>
                    </label>
                    <label>Bodyweight (kg)
                        <input type="number" name="bodyweight" min="0" step="0.1" placeholder="Optional">
                    </label>
                    <label>Height (cm)
                        <input type="number" name="height" min="0" step="0.1" placeholder="Optional">
                    </label>
                    <label>Age
                        <input type="number" name="age" min="0" step="1" placeholder="Optional">
                    </label>
                    <p class="form-error" id="profileError" hidden></p>
                    <button type="submit" class="button start">Continue</button>
                </form>
            </div>

            <div class="card form-card">
                <h2>Returning?</h2>
                <p class="subhead small">Jump back into an existing profile instead of creating a new one.</p>
                <form id="returningForm" class="form">
                    <label>Profile
                        <select name="userId" id="userSelect">
                            <option value="">Loading…</option>
                        </select>
                    </label>
                    <button type="submit" class="button secondary">Go to dashboard</button>
                </form>
            </div>
        </main>

        <script src="app.js"></script>
        <script src="shared/bodyGroups.js"></script>
        <script src="store.js"></script>
        <script src="onboarding.js"></script>
    </body>
</html>

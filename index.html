<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <!-- Before theme-init.js, which sets it to match the theme it picks. -->
    <meta name="theme-color" content="#050505" />
    <!-- Must run before anything paints, so it stays an unbundled script in
         public/ rather than moving into the React tree. -->
    <script src="/theme-init.js"></script>
    <title>Tsyoku-naru</title>
    <meta name="description" content="A free, private workout tracker. Log every set, see which muscles you've trained lately, and get a full-body plan from your own history." />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <!-- Installable as an app: Add to Home Screen on iPhone and iPad, Install
         on Android and desktop Chrome/Edge. The service worker that makes it
         open offline is registered from src/lib/serviceWorker.js. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- Full-bleed and opaque: iOS cuts its own rounded corners, and anything
         transparent under them shows as black. -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Tsyoku-naru" />
    <!-- "default" keeps the status bar off the page. "black-translucent" would
         draw white status text over it, which vanishes on the light theme. -->
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
